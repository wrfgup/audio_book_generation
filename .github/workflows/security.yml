name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and audit tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable ".[dev]"
      - name: Audit installed dependencies
        run: pip-audit
      - name: Check release candidate files
        run: python scripts/prepublish_check.py
      - name: Scan checkout for secrets
        env:
          PYTHONUTF8: "1"
        run: |
          python -X utf8 -m detect_secrets scan --all-files --no-verify \
            --exclude-files '(^|[\\/])(\.git|tests)([\\/]|$)' \
            > "$RUNNER_TEMP/detect-secrets-report.json"
          python -X utf8 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "detect-secrets-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          results = report["results"]
          count = sum(len(items) for items in results.values())
          if count:
              print(f"detect-secrets found {count} unaudited result(s).")
              for filename, items in sorted(results.items()):
                  for item in items:
                      print(json.dumps({
                          "file": filename,
                          "line": item["line_number"],
                          "type": item["type"],
                      }, ensure_ascii=True))
              raise SystemExit(1)
          print("detect-secrets found no unaudited results.")
          PY
